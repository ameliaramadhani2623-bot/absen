<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiHadir - Absensi Siswa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F2F5FF;--card:#fff;--ink:#1E2A78;--tx:#1F2937;--mu:#64748B;--pr:#3B5BDB;--pr2:#12B5CB;--ac:#FF9F1C;--ok:#16A34A;--bd:#E3E8F8;--sh:0 4px 14px rgba(59,91,219,.10)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1330;--card:#1A2048;--ink:#C7D2FE;--tx:#E2E8F0;--mu:#94A3B8;--bd:#2E3670;--sh:none}}
:root[data-theme="dark"]{--bg:#0E1330;--card:#1A2048;--ink:#C7D2FE;--tx:#E2E8F0;--mu:#94A3B8;--bd:#2E3670;--sh:none}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%;background-image:radial-gradient(circle at 12% 0,rgba(18,181,203,.13),transparent 40%),radial-gradient(circle at 100% 30%,rgba(255,159,28,.10),transparent 35%);background-attachment:fixed}
.top{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;padding:12px 14px;box-shadow:0 3px 12px rgba(59,91,219,.3);display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top b{flex:1;font-size:18px}.top b i{color:#FFD08A;font-style:normal}.pill{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}.top span.nm{font-size:14px}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;border-radius:99px;padding:8px 14px;background:transparent;color:var(--mu);font:inherit;cursor:pointer;transition:.2s}
nav button:hover{background:var(--bg)}nav .on{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 3px 8px rgba(59,91,219,.3)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
h3{margin:0 0 10px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;border-top:5px solid var(--pr);box-shadow:var(--sh)}
.st b{font-size:28px;color:var(--ink);display:block}.st small{color:var(--mu)}
.btn{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;font-weight:600;padding:9px 14px;font:inherit;cursor:pointer}
.btn.y{background:var(--ac);color:#fff}.btn.g{background:linear-gradient(120deg,#16A34A,#4ADE80)}.btn.r{background:#EF4444}.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}.sc{overflow-x:auto}
.bd{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.Hadir{background:#22C55E}.Izin{background:#3B5BDB}.Sakit{background:#F59E0B}.Alfa{background:#EF4444}
a{color:var(--pr)}small{color:var(--mu)}
.row{display:flex;gap:10px;align-items:center}
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;cursor:pointer}
#sp svg{width:90%;max-width:420px;height:auto}#sp p{color:var(--mu)}
#m{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#m.on{display:flex}
#m .card{max-width:440px;width:100%;max-height:90%;overflow:auto;margin:0}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1E2A78;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none;max-width:90%}
.lg{max-width:400px;margin:5vh auto;padding:0 14px}.hero{text-align:center;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));border-radius:22px 22px 0 0;padding:26px 16px 34px;box-shadow:var(--sh)}.hero .em{font-size:46px;line-height:1}.hero h1{margin:6px 0 12px;font-size:32px}.hero h1 span{color:#FFD08A}.hero p{margin:0 0 10px;opacity:.95}.chip{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:12px}.lgc{margin-top:-18px;border-radius:22px 22px 18px 18px}
.bob{animation:bob 2.4s ease-in-out infinite}.wave{transform-origin:395px 300px;animation:wave 1.1s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.bubble{transform-origin:440px 146px;animation:pop 4s ease-in-out infinite}
.w1,.w2,.w3,.wd{animation:pulse 1.8s ease-in-out infinite}.w2{animation-delay:.25s}.w3{animation-delay:.5s}
.s1,.s2{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s2{animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pop{0%,8%{transform:scale(0)}18%{transform:scale(1.12)}26%,82%{transform:scale(1)}92%,100%{transform:scale(0)}}
@keyframes pulse{0%,100%{opacity:.2}40%{opacity:1}}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1.2);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="sp" onclick="hs()"><svg viewBox="0 0 680 430" role="img" aria-label="Logo animasi SiHadir"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BDB"/><stop offset="1" stop-color="#12B5CB"/></linearGradient><clipPath id="c"><circle cx="340" cy="200" r="150"/></clipPath></defs>

<line x1="284" y1="305" x2="282" y2="360" stroke="#CBD5E1" stroke-width="26" stroke-linecap="round"/><line x1="284" y1="305" x2="282" y2="360" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
<path d="M266 360 Q266 275 340 275 Q414 275 414 360 Z" fill="#fff"/><polygon points="340,280 318,277 336,299" fill="#E2E8F0"/><polygon points="340,280 362,277 344,299" fill="#E2E8F0"/><polygon points="340,286 332,300 340,338 348,300" fill="#1E2A78"/><rect x="330" y="258" width="20" height="22" fill="#E8B183"/></g></g>
<g class="bob"><g class="wave"><line x1="395" y1="305" x2="432" y2="240" stroke="#CBD5E1" stroke-width="26" stroke-linecap="round"/><line x1="395" y1="305" x2="432" y2="240" stroke="#fff" stroke-width="22" stroke-linecap="round"/><circle cx="436" cy="230" r="14" fill="#F5C79B"/></g>
<circle cx="292" cy="230" r="8" fill="#E8B183"/><circle cx="388" cy="230" r="8" fill="#E8B183"/><circle cx="340" cy="225" r="48" fill="#F5C79B"/>
<path d="M291 222 Q289 168 340 168 Q391 168 389 222 Q372 196 340 196 Q308 196 291 222 Z" fill="#1F2937"/>
<ellipse class="eye" cx="322" cy="230" rx="4.5" ry="6.5" fill="#1F2937"/><ellipse class="eye" cx="358" cy="230" rx="4.5" ry="6.5" fill="#1F2937"/>
<circle cx="311" cy="245" r="7" fill="#FB7185" opacity=".5"/><circle cx="369" cy="245" r="7" fill="#FB7185" opacity=".5"/><path d="M326 247 Q340 262 354 247" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round"/></g>
<g class="bubble"><rect x="415" y="86" width="130" height="50" rx="25" fill="#fff"/><polygon points="438,132 454,132 438,148" fill="#fff"/><text x="432" y="118" font-size="23" font-weight="600" fill="#1E2A78" font-family="system-ui,sans-serif">Hadir!</text><circle cx="519" cy="111" r="14" fill="#16A34A"/><path d="M512 111 L517 116 L526 105" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g fill="none" stroke="#FF9F1C" stroke-width="5" stroke-linecap="round"><path class="w3" d="M231 119 A44 44 0 0 1 293 119"/><path class="w2" d="M241 129 A30 30 0 0 1 283 129"/><path class="w1" d="M251 139 A16 16 0 0 1 273 139"/></g>
<circle class="wd" cx="262" cy="152" r="5" fill="#FF9F1C"/><circle class="s1" cx="215" cy="230" r="7" fill="#FF9F1C"/><circle class="s2" cx="470" cy="270" r="6" fill="#fff"/>
<text x="340" y="415" text-anchor="middle" font-size="44" font-weight="600" font-family="system-ui,sans-serif"><tspan fill="var(--pr)">Si</tspan><tspan fill="var(--ink)">Hadir</tspan></text></svg>
<p>Ketuk untuk mulai</p></div>
<div id="root"></div><div id="m" onclick="if(event.target==this)cm()"><div class="card" id="mb"></div></div><div id="tt"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),TD=()=>ymd(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const K='sihadir_v2';let DB,U=null,P='dashboard',G={},PH=null,F={d:'',s:'',k:''};
function seed(){const kelas=[{id:'k1',nama:'IX A',wali:'Bu Rina'},{id:'k2',nama:'IX B',wali:'Pak Budi'},{id:'k3',nama:'IX C',wali:'Bu Dewi'}];
const siswa=['Andi Pratama','Siti Aulia','Rizky Ramadhan','Nabila Putri','Dimas Saputra','Ayu Lestari','Bagas Wijaya','Putri Maharani','Fajar Nugroho'].map((n,i)=>({id:'s'+i,nis:String(1001+i),nama:n,kelas:kelas[i%3].id,pw:'siswa123'}));
const absen=[],S=['Hadir','Hadir','Hadir','Izin','Hadir','Sakit','Hadir','Alfa'];
for(let d=1;d<=6;d++){const dt=new Date();dt.setDate(dt.getDate()-d);if(dt.getDay()%6==0)continue;siswa.forEach((s,i)=>absen.push({id:uid()+i+d,sid:s.id,tgl:ymd(dt),jam:'07:'+String(10+i*3).padStart(2,'0'),st:S[(i*3+d)%8],ket:'',foto:null,lat:-7.6298,lng:111.5239,acc:15,luar:false}))}
return{admin:{nama:'Admin Sekolah',email:'admin@sihadir.id',pw:'admin123'},kelas,siswa,absen,sch:{lat:-7.6298,lng:111.5239,r:150}}}
try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}if(!DB)DB=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Penyimpanan penuh, data tidak tersimpan permanen')}};
const kn=id=>(DB.kelas.find(k=>k.id==id)||{}).nama||'-',sw=id=>DB.siswa.find(s=>s.id==id),cur=()=>U.role=='admin'?DB.admin:sw(U.id);
function toast(t){const e=$('tt');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2800)}
function modal(h){$('mb').innerHTML=h;$('m').classList.add('on')}function cm(){$('m').classList.remove('on')}
function hs(){const s=$('sp');s.style.opacity=0;setTimeout(()=>s.remove(),600)}setTimeout(hs,4200);
/* AUTH */
function showLogin(){const d=new Date(),y=d.getFullYear(),ta=d.getMonth()>=6?y+'/'+(y+1):(y-1)+'/'+y;$('root').innerHTML=`<div class="lg"><div class="hero"><div class="em">🎒</div><h1><span>Si</span>Hadir</h1><span class="chip">SMP • Tahun Ajaran ${ta}</span></div><div class="card lgc"><h3 style="text-align:center">Selamat Datang 👋</h3>
<form onsubmit="login(event)"><label>NIS / Username Admin</label><input id="lu" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Masukkan NIS (contoh: 1001)"><label>Password</label><input id="lp" type="password" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Masukkan password"><label style="display:flex;gap:6px;align-items:center;margin:-4px 0 10px"><input type="checkbox" style="width:auto;margin:0" onchange="$('lp').type=this.checked?'text':'password'"> Tampilkan password</label><p id="le" style="color:#EF4444;margin:0 0 8px"></p><button class="btn" style="width:100%;padding:11px">Masuk</button></form></div></div>`}
function login(e){e.preventDefault();const u=$('lu').value.trim().toLowerCase(),p=$('lp').value.trim();
if((u==DB.admin.email||u=='admin')&&p==DB.admin.pw)U={role:'admin'};else{const s=DB.siswa.find(s=>s.nis==u&&s.pw==p);if(!s)return $('le').textContent='Username atau password salah';U={role:'siswa',id:s.id}}P='dashboard';G={};app()}
function logout(){stopGps();stopCam();U=null;PH=null;showLogin()}
/* SHELL */
const NAV=()=>U.role=='admin'?[['dashboard','Dashboard'],['siswa','Data Siswa'],['kelas','Data Kelas'],['riwayat','Riwayat'],['rekap','Rekap'],['lokasi','Lokasi'],['profil','Profil']]:[['dashboard','Dashboard'],['absen','Absensi'],['lokasi','Lokasi'],['riwayat','Riwayat'],['rekap','Rekap'],['profil','Profil']];
function go(p){P=p;app()}
function app(){stopCam();if(P!="absen"&&P!="lokasi")stopGps();const pg={dashboard:dash,siswa:pSiswa,kelas:pKelas,absen:pAbsen,lokasi:pLokasi,riwayat:pRiwayat,rekap:pRekap,profil:pProfil}[P]();
$('root').innerHTML=`<div class="top"><b>Si<i>Hadir</i></b><span class="nm">${esc(cur().nama)}</span><button class="btn y s" onclick="logout()">Logout</button></div><nav>${NAV().map(n=>`<button class="${n[0]==P?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><main>${pg}</main>`;
if(P=='absen'||P=='lokasi'){if(!G.lat&&!G.busy)getLoc();else upd()}window.scrollTo(0,0)}
/* DASHBOARD */
const stats=l=>{const c={Hadir:0,Izin:0,Sakit:0,Alfa:0};l.forEach(a=>c[a.st]++);return c};
function dash(){const a=U.role=='admin',l=a?DB.absen.filter(x=>x.tgl==TD()):DB.absen.filter(x=>x.sid==U.id),c=stats(l),n=a?DB.siswa.length:l.length,t=a?n-c.Hadir-c.Izin-c.Sakit:c.Alfa;
const cd=[[a?'Jumlah Siswa':'Total Absensi',n,'#3B5BDB'],['Hadir',c.Hadir,'#16A34A'],['Izin',c.Izin,'#3B5BDB'],['Sakit',c.Sakit,'#F59E0B'],['Tidak Hadir',t,'#EF4444']];
const rec=[...(a?DB.absen:DB.absen.filter(x=>x.sid==U.id))].sort((x,y)=>(y.tgl+y.jam).localeCompare(x.tgl+x.jam)).slice(0,5);
const td=DB.absen.find(x=>x.sid==U.id&&x.tgl==TD());
return `<h3>Halo, ${esc(cur().nama)} 👋</h3><small>${a?'Ringkasan hari ini':'Ringkasan kehadiranmu'} • ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small><div class="grid" style="margin-top:10px">${cd.map(x=>`<div class="st" style="border-top-color:${x[2]}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
${a?'':`<div class="card row"><div style="flex:1">${td?`Hari ini kamu sudah absen: <span class="bd ${td.st}">${td.st}</span> pukul ${td.jam}`:'Kamu belum absen hari ini.'}</div>${td?'':'<button class="btn g" onclick="go(\'absen\')">Absen Sekarang</button>'}</div>`}
<h3>Absensi Terbaru</h3>${rec.map(x=>item(x,0)).join('')||'<small>Belum ada data.</small>'}`}
function maps(a){return a.lat?` • <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${a.lat},${a.lng}">📍 lokasi</a>${a.jr!=null?' • '+a.jr+' m dari sekolah':''}`:''}
function item(a,ed){const s=sw(a.sid)||{};return `<div class="card row">${a.foto?`<img src="${a.foto}" onclick="big('${a.id}')" alt="foto" style="width:56px;height:56px;object-fit:cover;border-radius:10px;cursor:pointer">`:'<div style="width:56px;height:56px;border-radius:10px;background:var(--bg);display:grid;place-items:center">👤</div>'}
<div style="flex:1;min-width:0"><b>${esc(s.nama)}</b> <span class="bd ${a.st}">${a.st}</span><br><small>${a.tgl} ${a.jam} • ${kn(s.kelas)}${maps(a)}${a.luar?' • ⚠ luar area':''}${a.ket?'<br>'+esc(a.ket):''}</small></div>
${ed?`<div><button class="btn s o" onclick="eA('${a.id}')">Edit</button> <button class="btn s r" onclick="dA('${a.id}')">Hapus</button></div>`:''}</div>`}
function big(id){const a=DB.absen.find(x=>x.id==id);modal(`<img src="${a.foto}" alt="foto absensi" style="width:100%;border-radius:10px"><p><small>${esc((sw(a.sid)||{}).nama)} • ${a.tgl} ${a.jam}</small></p><button class="btn" onclick="cm()">Tutup</button>`)}
/* CRUD SISWA */
function pSiswa(){return `<div class="row" style="margin-bottom:10px"><h3 style="flex:1;margin:0">Data Siswa</h3><button class="btn" onclick="fS()">+ Tambah</button></div><div class="card sc"><table><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th></th></tr>${DB.siswa.map(s=>`<tr><td>${esc(s.nis)}</td><td>${esc(s.nama)}</td><td>${kn(s.kelas)}</td><td style="white-space:nowrap"><button class="btn s o" onclick="fS('${s.id}')">Edit</button> <button class="btn s r" onclick="dS('${s.id}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function fS(id){const s=DB.siswa.find(x=>x.id==id)||{};modal(`<h3>${id?'Edit':'Tambah'} Siswa</h3><form onsubmit="sS(event,'${id||''}')"><label>NIS</label><input name="nis" required value="${esc(s.nis)}"><label>Nama</label><input name="nama" required value="${esc(s.nama)}"><label>Password</label><input name="pw" required value="${esc(s.pw||'siswa123')}"><label>Kelas</label><select name="kelas">${DB.kelas.map(k=>`<option value="${k.id}" ${k.id==s.kelas?'selected':''}>${esc(k.nama)}</option>`).join('')}</select><button class="btn">Simpan</button> <button type="button" class="btn o" onclick="cm()">Batal</button></form>`)}
function sS(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(DB.siswa.some(x=>x.nis==f.nis&&x.id!=id))return toast('NIS sudah dipakai');
if(id)Object.assign(DB.siswa.find(x=>x.id==id),f);else DB.siswa.push({id:uid(),pw:'siswa123',...f});save();cm();app();toast('Data siswa disimpan')}
function dS(id){modal(`<h3>Hapus siswa?</h3><p>Riwayat absensinya juga akan terhapus.</p><button class="btn r" onclick="xS('${id}')">Hapus</button> <button class="btn o" onclick="cm()">Batal</button>`)}
function xS(id){DB.siswa=DB.siswa.filter(x=>x.id!=id);DB.absen=DB.absen.filter(x=>x.sid!=id);save();cm();app()}
/* CRUD KELAS */
function pKelas(){return `<div class="row" style="margin-bottom:10px"><h3 style="flex:1;margin:0">Data Kelas</h3><button class="btn" onclick="fK()">+ Tambah</button></div><div class="card sc"><table><tr><th>Kelas</th><th>Wali Kelas</th><th>Siswa</th><th></th></tr>${DB.kelas.map(k=>`<tr><td>${esc(k.nama)}</td><td>${esc(k.wali)}</td><td>${DB.siswa.filter(s=>s.kelas==k.id).length}</td><td style="white-space:nowrap"><button class="btn s o" onclick="fK('${k.id}')">Edit</button> <button class="btn s r" onclick="dK('${k.id}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function fK(id){const k=DB.kelas.find(x=>x.id==id)||{};modal(`<h3>${id?'Edit':'Tambah'} Kelas</h3><form onsubmit="sK(event,'${id||''}')"><label>Nama Kelas</label><input name="nama" required value="${esc(k.nama)}"><label>Wali Kelas</label><input name="wali" required value="${esc(k.wali)}"><button class="btn">Simpan</button> <button type="button" class="btn o" onclick="cm()">Batal</button></form>`)}
function sK(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(id)Object.assign(DB.kelas.find(x=>x.id==id),f);else DB.kelas.push({id:uid(),...f});save();cm();app()}
function dK(id){if(DB.siswa.some(s=>s.kelas==id))return toast('Kelas masih memiliki siswa');DB.kelas=DB.kelas.filter(x=>x.id!=id);save();app()}
/* LOKASI / GPS */
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
let WID=null,STR=null,PHL=null;
function stopGps(){if(WID!=null&&navigator.geolocation){navigator.geolocation.clearWatch(WID)}WID=null}
function stopCam(){if(STR){STR.getTracks().forEach(t=>t.stop());STR=null}}
function getLoc(){stopGps();G={busy:1};upd();if(!navigator.geolocation){G={err:'Perangkat tidak mendukung GPS'};return upd()}
WID=navigator.geolocation.watchPosition(p=>{G={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};upd()},e=>{G={err:'Lokasi gagal dideteksi ('+e.message+'). Aktifkan izin lokasi lalu tekan Deteksi Ulang.'};upd()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function demoLoc(){stopGps();G={lat:DB.sch.lat+.0003,lng:DB.sch.lng+.0002,acc:20,demo:1};upd()}
function locBox(){if(G.busy)return '⏳ Mendeteksi lokasi GPS… (izinkan akses lokasi)';let h='';
if(G.err)h=`<p style="color:#EF4444">${esc(G.err)}</p>`;
else if(G.lat){const j=dist(G.lat,G.lng,DB.sch.lat,DB.sch.lng),ok=j<=DB.sch.r;h=`<p><b>${G.lat.toFixed(6)}, ${G.lng.toFixed(6)}</b> <small>(akurasi ±${G.acc} m${G.demo?', simulasi':''})</small><br>Jarak ke sekolah: <b>${j} m</b> <span class="bd ${ok?'Hadir':'Alfa'}">${ok?'Dalam area':'Di luar area'}</span>${G.acc>100?'<br><small style="color:#F59E0B">⚠ Akurasi GPS rendah, pindah ke tempat terbuka.</small>':''}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${G.lat},${G.lng}">Lihat di peta</a></p>`}
return h+`<button class="btn s" onclick="getLoc()">📍 Deteksi Ulang</button>`+(U.role=='admin'?` <button class="btn s o" onclick="demoLoc()">Simulasi lokasi</button>`:'')}
function upd(){const b=$('gps');if(b)b.innerHTML=locBox()}
function pLokasi(){const a=U.role=='admin',s=DB.sch,l=[...(a?DB.absen:DB.absen.filter(x=>x.sid==U.id))].filter(x=>x.lat).sort((x,y)=>(y.tgl+y.jam).localeCompare(x.tgl+x.jam)).slice(0,6);
return `<h3>Lokasi Absensi</h3><div class="card"><b>Lokasimu saat ini</b><div id="gps" style="margin-top:8px"></div></div>
<div class="card"><b>Titik Sekolah</b>${a?`<form onsubmit="sL(event)"><label>Latitude</label><input name="lat" type="number" step="any" value="${s.lat}"><label>Longitude</label><input name="lng" type="number" step="any" value="${s.lng}"><label>Radius (meter)</label><input name="r" type="number" min="10" value="${s.r}"><button class="btn">Simpan</button> <button type="button" class="btn o" onclick="setSch()">Pakai lokasiku sekarang</button></form>`:`<p>${s.lat}, ${s.lng} • radius ${s.r} m</p>`}<p><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.lat},${s.lng}">Lihat titik sekolah di peta</a></p></div>
<h3>Lokasi Absensi Terakhir</h3>${l.map(x=>item(x,0)).join('')||'<small>Belum ada data.</small>'}`}
function sL(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));DB.sch={lat:+f.lat,lng:+f.lng,r:+f.r};save();toast('Titik sekolah disimpan');app()}
function setSch(){if(!G.lat||G.demo)return toast('Tunggu lokasi GPS asli terdeteksi dulu');DB.sch.lat=G.lat;DB.sch.lng=G.lng;save();toast('Titik sekolah diperbarui sesuai lokasimu');app()}
/* ABSENSI FOTO + LOKASI */
function pAbsen(){const td=DB.absen.find(x=>x.sid==U.id&&x.tgl==TD());PH=null;PHL=null;
if(td)return `<h3>Absensi</h3><div class="card"><p>✅ Kamu sudah absen hari ini.</p></div>${item(td,0)}`;
return `<h3>Absensi Siswa</h3><div class="card"><b>1. Lokasi GPS</b><div id="gps" style="margin-top:8px"></div><p><small>Absen <b>Hadir</b> hanya bisa dilakukan di dalam radius ${DB.sch.r} m dari sekolah.</small></p></div>
<div class="card"><b>2. Foto Selfie di Lokasi</b><p><small>Foto diambil langsung dari kamera dan otomatis dibubuhi nama, waktu, dan koordinat GPS saat foto diambil.</small></p>
<label>Status Kehadiran</label><select id="as"><option>Hadir</option><option>Izin</option><option>Sakit</option></select>
<video id="vd" autoplay playsinline muted style="display:none;width:100%;border-radius:12px;background:#000;transform:scaleX(-1);margin-bottom:10px"></video>
<canvas id="cv" style="width:100%;border-radius:12px;display:none;margin-bottom:10px"></canvas>
<div class="row" style="flex-wrap:wrap;margin-bottom:10px"><button class="btn" id="bc" onclick="openCam()">📷 Buka Kamera</button><button class="btn y" id="bs" style="display:none" onclick="snap()">📸 Ambil Foto</button></div>
<input type="file" id="ph" accept="image/*" capture="user" style="display:none" onchange="pic(this)">
<textarea id="ak" rows="2" placeholder="Keterangan (opsional)"></textarea><button class="btn g" style="width:100%" onclick="kirim()">Kirim Absensi</button></div>`}
function openCam(){if(!G.lat)return toast('Tunggu lokasi GPS terdeteksi dulu');
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return $('ph').click();
stopCam();navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(s=>{STR=s;const v=$('vd');v.srcObject=s;v.style.display='block';$('cv').style.display='none';$('bs').style.display='';$('bc').textContent='📷 Kamera Aktif';PH=null;PHL=null}).catch(()=>{toast('Kamera web tidak bisa dibuka, gunakan kamera bawaan HP');$('ph').click()})}
function snap(){const v=$('vd');if(!v.videoWidth)return toast('Kamera belum siap');if(!G.lat)return toast('Lokasi GPS belum terdeteksi');stamp(v,v.videoWidth,v.videoHeight);stopCam();v.style.display='none';$('bs').style.display='none';$('bc').textContent='🔄 Foto Ulang'}
function pic(i){const f=i.files[0];if(!f)return;if(!G.lat){toast('Tunggu lokasi terdeteksi dulu, lalu ambil foto lagi');i.value='';return}
const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{stamp(im,im.width,im.height);$('bc').textContent='🔄 Foto Ulang';i.value=''};im.src=r.result};r.readAsDataURL(f)}
function stamp(el,sw,sh){const c=$('cv'),w=480,h=Math.round(sh*w/sw),x=c.getContext('2d');c.width=w;c.height=h;x.drawImage(el,0,0,w,h);
const s=cur(),j=dist(G.lat,G.lng,DB.sch.lat,DB.sch.lng),ok=j<=DB.sch.r,L=[s.nama+' • '+kn(s.kelas),new Date().toLocaleString('id-ID'),G.lat.toFixed(6)+', '+G.lng.toFixed(6)+' (±'+G.acc+' m)',j+' m dari sekolah • '+(ok?'Dalam area':'Di luar area')];
x.fillStyle='rgba(15,23,42,.68)';x.fillRect(0,h-82,w,82);x.fillStyle='#fff';x.font='13px system-ui';x.textAlign='left';L.forEach((t,i)=>x.fillText(t,10,h-62+i*18));
x.fillStyle='#FFB84D';x.font='bold 13px system-ui';x.textAlign='right';x.fillText('SiHadir',w-10,h-62);x.textAlign='left';
c.style.display='block';PH=c.toDataURL('image/jpeg',.6);PHL={lat:G.lat,lng:G.lng,acc:G.acc}}
function kirim(){const st=$('as').value;
if(DB.absen.some(x=>x.sid==U.id&&x.tgl==TD()))return toast('Kamu sudah absen hari ini');
if(!PH||!PHL)return toast('Ambil foto selfie dulu (GPS harus aktif)');
if(G.lat&&dist(PHL.lat,PHL.lng,G.lat,G.lng)>50)return toast('Lokasimu berubah sejak foto diambil. Ambil foto ulang.');
const j=dist(PHL.lat,PHL.lng,DB.sch.lat,DB.sch.lng),n=new Date();
if(st=='Hadir'&&j>DB.sch.r)return toast('Kamu di luar area sekolah ('+j+' m). Absen Hadir hanya dalam radius '+DB.sch.r+' m.');
DB.absen.push({id:uid(),sid:U.id,tgl:TD(),jam:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),st,ket:$('ak').value,foto:PH,lat:PHL.lat,lng:PHL.lng,acc:PHL.acc,jr:j,luar:j>DB.sch.r});
save();stopGps();toast('Absensi berhasil dikirim ✅');go('riwayat')}
/* RIWAYAT */
function pRiwayat(){const a=U.role=='admin';return `<h3>Riwayat Absensi</h3><div class="card"><div class="row"><div style="flex:1"><label>Tanggal</label><input type="date" value="${F.d}" onchange="F.d=this.value;rl()"></div>${a?`<div style="flex:1"><label>Siswa</label><select onchange="F.s=this.value;rl()"><option value="">Semua</option>${DB.siswa.map(s=>`<option value="${s.id}" ${F.s==s.id?'selected':''}>${esc(s.nama)}</option>`).join('')}</select></div>`:''}</div></div><div id="rl">${rlist()}</div>`}
function rlist(){const a=U.role=='admin',l=DB.absen.filter(x=>(a||x.sid==U.id)&&(!F.d||x.tgl==F.d)&&(!F.s||x.sid==F.s)).sort((x,y)=>(y.tgl+y.jam).localeCompare(x.tgl+x.jam));return l.map(x=>item(x,a)).join('')||'<small>Tidak ada data.</small>'}
function rl(){$('rl').innerHTML=rlist()}
function eA(id){const a=DB.absen.find(x=>x.id==id);modal(`<h3>Ubah Status</h3><select id="es">${['Hadir','Izin','Sakit','Alfa'].map(s=>`<option ${s==a.st?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="sA('${id}')">Simpan</button> <button class="btn o" onclick="cm()">Batal</button>`)}
function sA(id){DB.absen.find(x=>x.id==id).st=$('es').value;save();cm();app()}
function dA(id){DB.absen=DB.absen.filter(x=>x.id!=id);save();app()}
/* REKAP */
function pRekap(){const a=U.role=='admin',ss=DB.siswa.filter(s=>(a?(!F.k||s.kelas==F.k):s.id==U.id));
return `<h3>Rekap Absensi</h3>${a?`<div class="card"><label>Kelas</label><select onchange="F.k=this.value;app()"><option value="">Semua</option>${DB.kelas.map(k=>`<option value="${k.id}" ${F.k==k.id?'selected':''}>${esc(k.nama)}</option>`).join('')}</select></div>`:''}
<div class="card sc"><table><tr><th>Nama</th><th>Kelas</th><th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr>${ss.map(s=>{const c=stats(DB.absen.filter(x=>x.sid==s.id)),t=c.Hadir+c.Izin+c.Sakit+c.Alfa;return `<tr><td>${esc(s.nama)}</td><td>${kn(s.kelas)}</td><td>${c.Hadir}</td><td>${c.Izin}</td><td>${c.Sakit}</td><td>${c.Alfa}</td><td>${t?Math.round(c.Hadir/t*100):0}%</td></tr>`}).join('')}</table></div><small>H=Hadir, I=Izin, S=Sakit, A=Alfa, %=persentase hadir</small>`}
/* PROFIL */
function pProfil(){const u=cur(),a=U.role=='admin';return `<h3>Profil</h3><div class="card"><form onsubmit="sP(event)"><label>${a?'Email':'NIS'}</label><input value="${esc(a?u.email:u.nis)}" ${a?'name="email"':'disabled'}><label>Nama</label><input name="nama" required value="${esc(u.nama)}">${a?'':`<label>Kelas</label><input disabled value="${kn(u.kelas)}">`}<label>Password baru (kosongkan jika tidak diubah)</label><input name="pw" type="password"><button class="btn">Simpan Perubahan</button></form></div>`}
function sP(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),u=cur();u.nama=f.nama;if(f.email)u.email=f.email;if(f.pw)u.pw=f.pw;save();app();toast('Profil diperbarui')}
showLogin();
</script></body></html>
